# GreatClipper — single host. Three app processes + Caddy for HTTPS.
#   docker compose up -d --build
# Only Caddy is exposed. The app containers share ./data (SQLite + media).
x-app: &app
  build: .
  image: greatclipper:local
  env_file: .env
  volumes:
    - ./data:/data
    - ./config.yaml:/app/config.yaml:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *app
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on: [web]

  bot:
    <<: *app
    command: ["bot"]
    depends_on: [web]

  worker:
    <<: *app
    command: ["worker"]
    depends_on: [web]
    # keep the heavy worker from starving the scheduler/web on a 2 vCPU / 4 GB host
    cpus: "1.5"
    mem_limit: 3g

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CLIPPER_DOMAIN: ${CLIPPER_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
